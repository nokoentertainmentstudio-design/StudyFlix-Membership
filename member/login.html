<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Login — StudyFlix Membership</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3e 100%);
            color: #E8EEFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        :root {
            --gold: #FFD700;
            --orange: #FF6B00;
            --teal: #00D4B4;
            --blue: #2288FF;
            --muted: #8892B0;
            --card: #1C2640;
            --border: rgba(255,255,255,0.07);
        }

        .hero-bg {
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 20% 40%, #1e1040 0%, transparent 55%),
                radial-gradient(ellipse at 80% 70%, #0f2040 0%, transparent 55%);
            z-index: -2;
        }
        .hero-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(245,200,66,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245,200,66,.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.2rem 1.8rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }

        .auth-brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            text-align: center;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .auth-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: #E8EEFF;
            margin-bottom: 0.3rem;
        }

        .auth-sub {
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 1.8rem;
        }

        .form-group { margin-bottom: 1rem; }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: var(--teal); }
        .form-group input::placeholder { color: #5b6788; }

        /* ---------- PASSWORD WRAP + TOGGLE ---------- */
        .input-wrap { position: relative; }
        .input-wrap input { padding-right: 2.6rem; }

        .toggle-pw {
            position: absolute;
            right: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.3rem;
            line-height: 1;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--teal); }

        /* ---------- REMEMBER + FORGOT ROW ---------- */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.2rem 0 1.2rem;
            font-size: 0.78rem;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            font-weight: 600;
        }
        .remember input {
            width: auto;
            accent-color: var(--teal);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--teal);
            text-decoration: none;
            font-weight: 700;
        }
        .forgot-link:hover { text-decoration: underline; }

        .auth-btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #00FFCC, #2288FF);
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .auth-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,212,180,0.3); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .auth-error,
        .auth-success {
            display: none;
            font-size: 0.8rem;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            text-align: center;
            line-height: 1.4;
        }
        .auth-error {
            background: rgba(255,80,80,0.1);
            border: 1px solid rgba(255,80,80,0.35);
            color: #ff9b9b;
        }
        .auth-success {
            background: rgba(0,212,180,0.1);
            border: 1px solid rgba(0,212,180,0.35);
            color: #7ff0dd;
        }

        .terms-line {
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 1rem;
            line-height: 1.5;
        }
        .terms-line a { color: var(--teal); text-decoration: none; font-weight: 700; }
        .terms-line a:hover { text-decoration: underline; }

        .auth-footer {
            text-align: center;
            margin-top: 1.4rem;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .auth-footer a { color: var(--teal); font-weight: 700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--muted);
            text-decoration: none;
        }
        .back-home:hover { color: var(--teal); }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>

    <div class="auth-card">
        <div class="auth-brand">StudyFlix</div>
        <div class="auth-title">Welcome Back</div>
        <div class="auth-sub">Sign in to your membership account</div>

        <div class="auth-error" id="authError" role="alert"></div>
        <div class="auth-success" id="authSuccess" role="status"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
                    
                </div>
            </div>

            <div class="form-row">
                <label class="remember">
                    <input type="checkbox" id="remember" checked />
                    Remember me
                </label>
                <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                <span id="btnText">Sign In</span>
            </button>
        </form>

        <p class="terms-line">
            By signing in you agree to our
            <a href="../admin/terms.html">Terms</a> and
            <a href="../admin/privacy-policy.html">Privacy Policy</a>.
        </p>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABNx_RDW8ttLrSRRF0W3kHIzuU2DGpTHI",
            authDomain: "studyflix-membership.firebaseapp.com",
            projectId: "studyflix-membership",
            storageBucket: "studyflix-membership.firebasestorage.app",
            messagingSenderId: "641080177215",
            appId: "1:641080177215:web:8dc544f29bbad3d0acbe8a",
            measurementId: "G-3384WRNWXW"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        /* ---------- DOM ---------- */
        const form       = document.getElementById('loginForm');
        const errorBox   = document.getElementById('authError');
        const successBox = document.getElementById('authSuccess');
        const loginBtn   = document.getElementById('loginBtn');
        const btnText    = document.getElementById('btnText');
        const emailInput = document.getElementById('email');
        const passInput  = document.getElementById('password');
        const rememberBox= document.getElementById('remember');
        const forgotLink = document.getElementById('forgotLink');

        /* ---------- MESSAGE HELPERS ---------- */
        function showError(msg) {
            successBox.style.display = 'none';
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
        function showSuccess(msg) {
            errorBox.style.display = 'none';
            successBox.textContent = msg;
            successBox.style.display = 'block';
        }
        function clearMessages() {
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
        }

        function friendlyError(code) {
            switch (code) {
                case 'auth/invalid-email':          return 'That email address looks invalid.';
                case 'auth/user-not-found':         return 'No account found with that email.';
                case 'auth/wrong-password':         return 'Incorrect password. Please try again.';
                case 'auth/invalid-credential':     return 'Incorrect email or password.';
                case 'auth/missing-password':       return 'Please enter your password.';
                case 'auth/user-disabled':          return 'This account has been disabled. Contact support.';
                case 'auth/email-not-verified':     return 'Please verify your email before signing in.';
                case 'auth/operation-not-allowed':  return 'Sign-in is temporarily unavailable.';
                case 'auth/too-many-requests':      return 'Too many attempts. Please try again later.';
                case 'auth/network-request-failed': return 'Network error. Check your connection.';
                default:                            return 'Sign in failed. Please try again.';
            }
        }

        /* ---------- REDIRECT IF ALREADY SIGNED IN ---------- */
        let signingIn = false;
        auth.onAuthStateChanged(user => {
            if (user && !signingIn) window.location.href = 'dashboard.html';
        });

        

        /* ---------- FORGOT PASSWORD ---------- */
        forgotLink.addEventListener('click', async (e) => {
            e.preventDefault();
            clearMessages();

            const email = emailInput.value.trim();
            if (!email) {
                showError('Enter your email address above first, then tap "Forgot password".');
                emailInput.focus();
                return;
            }

            forgotLink.style.pointerEvents = 'none';
            forgotLink.style.opacity = '0.6';

            try {
                await auth.sendPasswordResetEmail(email);
                showSuccess('Reset link sent to ' + email + '. Check your inbox (and spam folder).');
            } catch (err) {
                console.error(err);
                showError(friendlyError(err.code));
            } finally {
                forgotLink.style.pointerEvents = '';
                forgotLink.style.opacity = '';
            }
        });

        /* ---------- SUBMIT ---------- */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const email    = emailInput.value.trim();
            const password = passInput.value;

            if (!email || !password) {
                showError('Please fill in all fields.');
                return;
            }

            signingIn = true;
            loginBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>Signing in...';

            try {
                /* Persistence BEFORE sign-in */
                const persistence = rememberBox.checked
                    ? firebase.auth.Auth.Persistence.LOCAL
                    : firebase.auth.Auth.Persistence.SESSION;
                try {
                    await auth.setPersistence(persistence);
                } catch (pErr) {
                    console.warn('setPersistence failed:', pErr.message);
                }

                await auth.signInWithEmailAndPassword(email, password);

                /* Success state on the button, then redirect */
                btnText.innerHTML = '<i class="fas fa-check"></i> Signed in';
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);

            } catch (err) {
                console.error(err);
                signingIn = false;
                showError(friendlyError(err.code));
                loginBtn.disabled = false;
                btnText.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
