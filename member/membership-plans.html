<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membership Plans | StudyFlix</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --gold: #FFD700;
            --orange: #FF6B00;
            --teal: #00D4B4;
            --blue: #2288FF;
            --muted: #8892B0;
            --card: #1C2640;
            --border: rgba(255,255,255,0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #080C18, #111A2E);
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(8, 12, 24, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .navbar-links {
            display: flex;
            gap: 25px;
        }

        .navbar-links a {
            color: white;
            text-decoration: none;
            font-weight: 700;
        }

        .navbar-links a:hover {
            color: var(--gold);
        }

        /* MAIN */
        .container {
            max-width: 1150px;
            margin: auto;
            padding: 50px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 52px;
            letter-spacing: 2px;
        }

        .highlight {
            color: var(--gold);
        }

        .page-sub {
            color: var(--muted);
            margin-top: 10px;
            font-size: 16px;
        }

        /* PLANS */
        .plans-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    max-width: 800px;
    margin: auto;
}

        .plan-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 35px 25px;
            text-align: center;
            transition: 0.3s;
        }

        .plan-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .plan-icon {
            font-size: 45px;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .plan-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .price {
            font-size: 30px;
            font-weight: 800;
            margin: 20px 0 5px;
            color: var(--teal);
        }

        .duration {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .benefits {
            list-style: none;
            text-align: left;
            margin-bottom: 30px;
        }

        .benefits li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            color: #dce2f0;
        }

        .benefits i {
            color: var(--teal);
            margin-right: 10px;
        }

        .apply-btn {
            display: inline-block;
            width: 100%;
            padding: 13px;
            background: var(--gold);
            color: #111;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
        }

        .apply-btn:hover {
            background: var(--orange);
            color: white;
        }

        /* RESPONSIVE */
        @media (max-width: 850px) {
    .plans-grid {
        grid-template-columns: 1fr;
        max-width: 500px;
        margin: auto;
    }

    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .navbar-links {
        flex-wrap: wrap;
        justify-content: center;
    }
}
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="index.html" class="navbar-brand">
            STUDYFLIX
        </a>

        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
        </div>

    </nav>


    <!-- MAIN -->
    <main class="container">

        <div class="page-header">

            <h1 class="page-title">
                MEMBERSHIP <span class="highlight">PLAN</span>
            </h1>

            

        </div>


        <div class="plans-grid">

            <!-- BASIC -->
            <div class="plan-card">

                <div class="plan-icon">
                    <i class="fas fa-crown"></i>
                </div>

                <h2 class="plan-name">StudyFix Membership</h2>
                

                <div class="price">
                    R100
                </div>

                <div class="duration">
                    per month
                </div>

                <ul class="benefits">
                    <li>
                        <i class="fas fa-check"></i>
                        Digital Membership Card
                    </li>

                    <li>
                        <i class="fas fa-check"></i>
                        Access to Member Benefits
                    </li>

                    <li>
                        <i class="fas fa-check"></i>
                        Partner Verification
                    </li>
                </ul>

                <a href="membership-application.html" class="apply-btn">
                    Apply Now
                </a>

            </div>



        </div>

    </main>

</body>
</html>
