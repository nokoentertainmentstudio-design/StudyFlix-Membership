<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Dashboard — StudyFlix</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #FFD700;
            --orange: #FF6B00;
            --teal: #00D4B4;
            --blue: #2288FF;
            --red: #ff5555;
            --muted: #8892B0;
            --card: #1C2640;
            --border: rgba(255,255,255,0.07);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #080C18, #111A2E);
            color: #E8EEFF;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .dash-main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 3rem;
        }

        @media (max-width: 768px) {
            .dash-main { padding-top: 75px; }
        }

        /* ---------- TOP BAR ---------- */
        .dash-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .dash-user { display: flex; align-items: center; gap: 0.8rem; }

        .dash-avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00FFCC, #2288FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 900;
            color: #000;
            flex-shrink: 0;
        }

        .dash-name { font-weight: 800; font-size: 0.98rem; line-height: 1.2; }
        .dash-email { color: var(--muted); font-size: 0.76rem; margin-top: 2px; }

        .dash-logout {
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff9b9b;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.78rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .dash-logout:hover { background: rgba(255, 80, 80, 0.2); border-color: rgba(255, 80, 80, 0.5); }
        .dash-logout i { margin-right: 5px; }

        /* ---------- HEADER ---------- */
        .dash-header { margin-bottom: 1.6rem; }
        .dash-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.6rem;
            letter-spacing: 1.5px;
            line-height: 1.1;
        }
        .dash-header h1 .highlight {
            background: linear-gradient(135deg, var(--gold), var(--orange));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .dash-header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.3rem; }
        .dash-header p strong { color: #E8EEFF; }

        /* ---------- ANNOUNCEMENTS ---------- */
        .dash-notifs { margin-bottom: 1.4rem; display: flex; flex-direction: column; gap: 0.7rem; }
        .dash-notifs:empty { display: none; }

        .dash-notif {
            display: flex;
            gap: 0.9rem;
            align-items: flex-start;
            padding: 1rem 1.1rem;
            border-radius: 14px;
            border: 1px solid;
            position: relative;
            animation: slideIn 0.35s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dash-notif.info    { background: rgba(34, 136, 255, 0.08);  border-color: rgba(34, 136, 255, 0.35); }
        .dash-notif.success { background: rgba(0, 212, 180, 0.08);   border-color: rgba(0, 212, 180, 0.35); }
        .dash-notif.warning { background: rgba(255, 215, 0, 0.07);   border-color: rgba(255, 215, 0, 0.35); }
        .dash-notif.urgent  { background: rgba(255, 85, 85, 0.08);   border-color: rgba(255, 85, 85, 0.4); }

        .dash-notif-icon {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.05rem;
        }
        .dash-notif.info    .dash-notif-icon { background: rgba(34, 136, 255, 0.15); color: #9cc7ff; }
        .dash-notif.success .dash-notif-icon { background: rgba(0, 212, 180, 0.15);  color: var(--teal); }
        .dash-notif.warning .dash-notif-icon { background: rgba(255, 215, 0, 0.15);  color: var(--gold); }
        .dash-notif.urgent  .dash-notif-icon { background: rgba(255, 85, 85, 0.15);  color: #ff9b9b; }

        .dash-notif-body { flex: 1; min-width: 0; }

        .dash-notif-title {
            font-weight: 800;
            font-size: 0.92rem;
            line-height: 1.35;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }
        .dash-notif.info    .dash-notif-title { color: #9cc7ff; }
        .dash-notif.success .dash-notif-title { color: var(--teal); }
        .dash-notif.warning .dash-notif-title { color: var(--gold); }
        .dash-notif.urgent  .dash-notif-title { color: #ff9b9b; }

        .dash-notif-text {
            color: #dce2f0;
            font-size: 0.82rem;
            line-height: 1.55;
            word-break: break-word;
        }

        .dash-notif-meta {
            color: var(--muted);
            font-size: 0.68rem;
            margin-top: 0.4rem;
            opacity: 0.75;
        }

        .dash-notif-close {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--muted);
            width: 26px; height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }
        .dash-notif-close:hover { background: rgba(255,255,255,0.1); color: #E8EEFF; }

        /* ---------- STATUS BANNER ---------- */
        .status-banner {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.3rem 1.5rem;
            border-radius: 16px;
            border: 1px solid;
            margin-bottom: 1.6rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .status-banner.banner-none     { background: rgba(34, 136, 255, 0.08); border-color: rgba(34, 136, 255, 0.3); }
        .status-banner.banner-pending  { background: rgba(255, 215, 0, 0.07);  border-color: rgba(255, 215, 0, 0.3); }
        .status-banner.banner-approved { background: rgba(0, 212, 180, 0.08);  border-color: rgba(0, 212, 180, 0.35); }
        .status-banner.banner-declined { background: rgba(255, 80, 80, 0.07);  border-color: rgba(255, 80, 80, 0.3); }

        .banner-icon {
            width: 54px; height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.5rem;
        }
        .banner-none     .banner-icon { background: rgba(34, 136, 255, 0.15); color: var(--blue); }
        .banner-pending  .banner-icon { background: rgba(255, 215, 0, 0.15);  color: var(--gold); }
        .banner-approved .banner-icon { background: rgba(0, 212, 180, 0.15);  color: var(--teal); }
        .banner-declined .banner-icon { background: rgba(255, 80, 80, 0.15);  color: var(--red); }

        .banner-body { flex: 1; min-width: 0; }

        .banner-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .banner-none     .banner-title { color: #9cc7ff; }
        .banner-pending  .banner-title { color: var(--gold); }
        .banner-approved .banner-title { color: var(--teal); }
        .banner-declined .banner-title { color: #ff9b9b; }

        .banner-text { color: var(--muted); font-size: 0.83rem; line-height: 1.55; margin-top: 0.25rem; }
        .banner-action { flex-shrink: 0; }

        .banner-btn {
            display: inline-block;
            padding: 0.65rem 1.3rem;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.8rem;
            text-decoration: none;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            color: #111;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .banner-btn:hover { transform: scale(1.04); box-shadow: 0 0 22px rgba(255,215,0,0.28); }
        .banner-approved .banner-btn { background: linear-gradient(135deg, #00FFCC, #2288FF); }
        .banner-declined .banner-btn {
            background: rgba(255,255,255,0.08);
            color: #E8EEFF;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .banner-declined .banner-btn:hover { box-shadow: 0 0 22px rgba(255,80,80,0.2); }

        /* ---------- STEPPER ---------- */
        .stepper {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.3rem;
            padding: 1.4rem 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 1.8rem;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            min-width: 0;
            gap: 0.55rem;
        }

        .step-circle {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.85rem;
            border: 2px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .step-item.done .step-circle {
            background: linear-gradient(135deg, var(--teal), #2288FF);
            border-color: transparent;
            color: #000;
        }
        .step-item.current .step-circle {
            background: linear-gradient(135deg, var(--gold), var(--orange));
            border-color: transparent;
            color: #000;
            box-shadow: 0 0 0 5px rgba(255,215,0,0.12);
            animation: pulse 2.2s ease-in-out infinite;
        }
        .step-item.failed .step-circle {
            background: rgba(255, 80, 80, 0.15);
            border-color: rgba(255, 80, 80, 0.5);
            color: var(--red);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 5px rgba(255,215,0,0.12); }
            50%      { box-shadow: 0 0 0 9px rgba(255,215,0,0.04); }
        }

        .step-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.3px;
            line-height: 1.3;
        }
        .step-item.done .step-label,
        .step-item.current .step-label { color: #E8EEFF; }
        .step-item.failed .step-label { color: #ff9b9b; }

        .step-line {
            flex: 0 0 auto;
            width: 30px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            align-self: 19px;
            margin-top: 18px;
            border-radius: 2px;
            transition: background 0.3s;
        }
        .step-line.done { background: linear-gradient(90deg, var(--teal), #2288FF); }

        /* ---------- STATS ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            transition: border-color 0.3s;
        }
        .stat-card:hover { border-color: rgba(0,212,180,0.3); }

        .stat-icon { font-size: 1.4rem; color: var(--gold); margin-bottom: 0.7rem; }
        .stat-title {
            color: var(--muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            margin-top: 0.35rem;
            word-break: break-word;
        }
        .stat-value.loading { color: var(--muted); font-weight: 600; font-size: 0.9rem; }

        .badge {
            display: inline-block;
            padding: 0.22rem 0.75rem;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.4px;
        }
        .badge-active   { background: rgba(0, 212, 180, 0.15); color: var(--teal); }
        .badge-pending  { background: rgba(255, 215, 0, 0.15);  color: var(--gold); }
        .badge-inactive { background: rgba(255, 100, 100, 0.15); color: #ff8888; }
        .badge-none     { background: rgba(136, 146, 176, 0.15); color: var(--muted); }

        /* ---------- SECTIONS ---------- */
        .dash-section { margin-bottom: 2rem; }

        .section-head {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .section-head .head-accent {
            display: inline-block;
            width: 4px;
            height: 22px;
            background: linear-gradient(180deg, var(--gold), var(--orange));
            border-radius: 4px;
        }

        /* ---------- NEXT ACTIONS ---------- */
        .next-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.1rem;
        }

        .next-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.4rem 1.3rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            text-decoration: none;
            color: inherit;
        }
        .next-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0,212,180,0.4);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        .next-card.primary {
            border-color: rgba(255, 215, 0, 0.35);
            background: linear-gradient(135deg, rgba(28,38,64,1), rgba(38,48,78,1));
        }
        .next-card.primary:hover {
            border-color: var(--gold);
            box-shadow: 0 12px 30px rgba(255,215,0,0.15);
        }

        .next-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: rgba(0, 212, 180, 0.12);
            color: var(--teal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }
        .next-card.primary .next-icon {
            background: rgba(255, 215, 0, 0.15);
            color: var(--gold);
        }

        .next-title { font-weight: 800; font-size: 0.95rem; line-height: 1.3; }
        .next-desc  { color: var(--muted); font-size: 0.8rem; line-height: 1.55; flex: 1; }
        .next-cta {
            font-weight: 800;
            font-size: 0.78rem;
            color: var(--teal);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .next-card.primary .next-cta { color: var(--gold); }
        .next-cta i { transition: transform 0.2s; }
        .next-card:hover .next-cta i { transform: translateX(4px); }

        /* ---------- ALL ACTIONS ---------- */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.1rem;
        }

        .action-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.3rem;
            text-decoration: none;
            color: #E8EEFF;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            position: relative;
        }
        .action-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0,212,180,0.4);
            box-shadow: 0 10px 25px rgba(0,212,180,0.1);
        }

        .action-card i.action-icon { font-size: 1.5rem; color: var(--teal); }
        .action-card h3 { margin: 0; font-size: 0.92rem; }
        .action-card p  { color: var(--muted); font-size: 0.76rem; line-height: 1.5; }

        .action-card.locked { opacity: 0.45; pointer-events: none; }
        .action-card.locked i.action-icon { color: var(--muted); }
        .action-card .lock-tag {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
            padding: 0.18rem 0.5rem;
            border-radius: 10px;
        }

        /* ---------- SKELETON ---------- */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: skel 1.4s ease-in-out infinite;
            border-radius: 6px;
            display: inline-block;
            width: 60%;
            height: 1rem;
            vertical-align: middle;
        }
        @keyframes skel {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .actions-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 700px) {
            .dash-header h1 { font-size: 2rem; }

            .status-banner {
                flex-direction: column;
                text-align: center;
                gap: 0.9rem;
                padding: 1.3rem 1rem;
            }
            .banner-action { width: 100%; }
            .banner-btn { display: block; width: 100%; }

            .stepper {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
                padding: 1.2rem 1rem;
            }
            .step-item { flex-direction: row; text-align: left; gap: 0.9rem; }
            .step-line {
                width: 2px;
                height: 18px;
                margin: 0 0 0 18px;
                align-self: flex-start;
            }
            .step-line.done { background: linear-gradient(180deg, var(--teal), #2288FF); }

            .stats-grid { grid-template-columns: 1fr; }
            .actions-grid { grid-template-columns: 1fr; }

            .dash-notif { padding: 0.85rem 0.9rem; gap: 0.7rem; }
            .dash-notif-icon { width: 34px; height: 34px; font-size: 0.95rem; }
            .dash-notif-title { font-size: 0.87rem; }
            .dash-notif-text { font-size: 0.78rem; }
        }

        @media (max-width: 480px) {
            .dash-name { font-size: 0.88rem; }
            .dash-logout { padding: 0.45rem 0.85rem; font-size: 0.72rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .step-item.current .step-circle { animation: none; }
            .skeleton { animation: none; }
            .dash-notif { animation: none; }
        }
    </style>
</head>
<body class="has-sidebar">

    <div id="sidebar-placeholder"></div>

    <main class="dash-main">

        <!-- ---------- TOP BAR ---------- -->
        <div class="dash-topbar">
            <div class="dash-user">
                <div class="dash-avatar" id="avatarEl">–</div>
                <div>
                    <div class="dash-name" id="topName"><span class="skeleton"></span></div>
                    <div class="dash-email" id="topEmail"></div>
                </div>
            </div>
            <button class="dash-logout" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- ---------- HEADER ---------- -->
        <header class="dash-header">
            <h1>YOUR <span class="highlight">DASHBOARD</span></h1>
            <p>Welcome back, <strong id="headerName">Member</strong>. Here's where your membership stands.</p>
        </header>

        <!-- ---------- ANNOUNCEMENTS (populated by JS) ---------- -->
        <div class="dash-notifs" id="dashNotifs"></div>

        <!-- ---------- STATUS BANNER ---------- -->
        <div class="status-banner banner-none" id="statusBanner">
            <div class="banner-icon">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <div class="banner-body">
                <div class="banner-title">Loading your status…</div>
                <div class="banner-text">Fetching your membership details.</div>
            </div>
            <div class="banner-action"></div>
        </div>

        <!-- ---------- STEPPER ---------- -->
        <div class="stepper" id="stepper"></div>

        <!-- ---------- STATS ---------- -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-id-card"></i></div>
                <div class="stat-title">Membership Number</div>
                <div class="stat-value loading" id="membershipNumber">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-title">Membership Status</div>
                <div class="stat-value loading" id="membershipStatus">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
                <div class="stat-title">Application Status</div>
                <div class="stat-value loading" id="applicationStatus">—</div>
            </div>
        </div>

        <!-- ---------- WHAT'S NEXT ---------- -->
        <section class="dash-section">
            <h2 class="section-head">
                <span class="head-accent"></span>
                What's next
            </h2>
            <div class="next-grid" id="nextGrid"></div>
        </section>

        <!-- ---------- ALL ACTIONS ---------- -->
        <section class="dash-section">
            <h2 class="section-head">
                <span class="head-accent"></span>
                All actions
            </h2>
            <div class="actions-grid" id="actionsGrid"></div>
        </section>

    </main>

    <!-- ================= FIREBASE ================= -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <!-- ================= SIDEBAR LOADER ================= -->
    <script>
        (function () {
            'use strict';
            const SIDEBAR_PLACEHOLDER_ID = 'sidebar-placeholder';
            const SIDEBAR_PATH = 'sidebar.html';

            async function loadSidebar() {
                const placeholder = document.getElementById(SIDEBAR_PLACEHOLDER_ID);
                if (!placeholder) return;
                try {
                    const response = await fetch(SIDEBAR_PATH);
                    const html = await response.text();
                    placeholder.innerHTML = html;
                    initSidebar();
                } catch (err) {
                    console.error('Failed to load sidebar:', err);
                }
            }

            function initSidebar() {
                const sidebar = document.getElementById('sidebar');
                const sidebarToggle = document.getElementById('sidebarToggle');
                const sidebarClose = document.getElementById('sidebarClose');
                const overlay = document.getElementById('sidebarOverlay');
                if (!sidebar) return;

                const nav = sidebar.querySelector('.sidebar-nav');
                if (nav && !nav.querySelector('[data-page="dashboard.html"]')) {
                    const dashLink = document.createElement('a');
                    dashLink.href = 'dashboard.html';
                    dashLink.className = 'sidebar-link';
                    dashLink.setAttribute('data-page', 'dashboard.html');
                    dashLink.innerHTML =
                        '<i class="fas fa-th-large"></i>' +
                        '<div class="link-content">' +
                            '<span class="link-title">Dashboard</span>' +
                            '<span class="link-desc">Your membership overview.</span>' +
                        '</div>';
                    nav.prepend(dashLink);
                }

                if (sidebarToggle) {
                    sidebarToggle.addEventListener('click', () => {
                        sidebar.classList.add('open');
                        if (overlay) overlay.classList.add('active');
                    });
                }
                function closeSidebar() {
                    sidebar.classList.remove('open');
                    if (overlay) overlay.classList.remove('active');
                }
                if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
                if (overlay) overlay.addEventListener('click', closeSidebar);

                const currentPath = window.location.pathname.split('/').pop() || 'index.html';
                sidebar.querySelectorAll('.sidebar-link').forEach(link => {
                    if (link.getAttribute('data-page') === currentPath) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadSidebar);
            } else {
                loadSidebar();
            }

            window.StudyFlixSidebar = {
                load: loadSidebar,
                close: function () {
                    const sidebar = document.getElementById('sidebar');
                    const overlay = document.getElementById('sidebarOverlay');
                    if (sidebar) sidebar.classList.remove('open');
                    if (overlay) overlay.classList.remove('active');
                }
            };
        })();
    </script>

    <!-- ================= DASHBOARD LOGIC ================= -->
    <script>
        /* ---------- FIREBASE ---------- */
        const firebaseConfig = {
            apiKey: "AIzaSyABNx_RDW8ttLrSRRF0W3kHIzuU2DGpTHI",
            authDomain: "studyflix-membership.firebaseapp.com",
            projectId: "studyflix-membership",
            storageBucket: "studyflix-membership.firebasestorage.app",
            messagingSenderId: "641080177215",
            appId: "1:641080177215:web:8dc544f29bbad3d0acbe8a",
            measurementId: "G-3384WRNWXW"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        /* ---------- STATE ---------- */
        const STATE = {
            NONE:     'none',
            PENDING:  'pending',
            APPROVED: 'approved',
            DECLINED: 'declined'
        };

        /* ---------- DOM ---------- */
        const els = {
            avatarEl:         document.getElementById('avatarEl'),
            topName:          document.getElementById('topName'),
            topEmail:         document.getElementById('topEmail'),
            headerName:       document.getElementById('headerName'),
            dashNotifs:       document.getElementById('dashNotifs'),
            statusBanner:     document.getElementById('statusBanner'),
            stepper:          document.getElementById('stepper'),
            membershipNumber: document.getElementById('membershipNumber'),
            membershipStatus: document.getElementById('membershipStatus'),
            applicationStatus:document.getElementById('applicationStatus'),
            nextGrid:         document.getElementById('nextGrid'),
            actionsGrid:      document.getElementById('actionsGrid'),
            logoutBtn:        document.getElementById('logoutBtn')
        };

        /* ---------- HELPERS ---------- */
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function toDate(ts) {
            if (!ts) return null;
            try {
                if (ts.toDate) return ts.toDate();
                if (ts.seconds) return new Date(ts.seconds * 1000);
                return new Date(ts);
            } catch (e) { return null; }
        }
        function timeAgo(d) {
            if (!d) return '';
            const s = Math.floor((Date.now() - d.getTime()) / 1000);
            if (s < 60) return 'just now';
            if (s < 3600) return Math.floor(s / 60) + 'm ago';
            if (s < 86400) return Math.floor(s / 3600) + 'h ago';
            if (s < 604800) return Math.floor(s / 86400) + 'd ago';
            return d.toLocaleDateString();
        }

        /* ---------- STATE MACHINE ---------- */
        function deriveState(data) {
            if (!data) return STATE.NONE;
            const appStatus = (data.applicationStatus || '').toString().toLowerCase();
            const memStatus = (data.status || data.membershipStatus || '').toString().toLowerCase();
            const hasApplication = !!(data.application && (data.application.submittedAt || data.application.firstName));

            if (memStatus === 'active' || memStatus === 'approved' || appStatus === 'approved') return STATE.APPROVED;
            if (['declined','rejected','inactive'].includes(memStatus) || ['declined','rejected'].includes(appStatus)) return STATE.DECLINED;
            if (hasApplication && ['pending','in review','under review'].includes(appStatus)) return STATE.PENDING;
            return STATE.NONE;
        }

        /* ---------- NAME RESOLUTION ---------- */
        async function resolveName(user, data) {
            let name = null, source = null;
            if (data && (data.name || data.fullName || data.displayName)) {
                name = data.name || data.fullName || data.displayName; source = 'firestore';
            }
            if (!name) {
                try {
                    const stored = localStorage.getItem('studyflix_name_' + user.uid);
                    if (stored && stored.trim()) { name = stored.trim(); source = 'localStorage'; }
                } catch (e) {}
            }
            if (!name && user.displayName && user.displayName.trim()) { name = user.displayName.trim(); source = 'auth'; }
            if (!name && user.email) { name = user.email.split('@')[0]; source = 'email'; }
            if (!name) { name = 'Member'; source = 'fallback'; }
            return { name, source };
        }

        /* ---------- HEAL MEMBER DOC ---------- */
        async function healMemberDoc(user, name, data) {
            const ref = db.collection('members').doc(user.uid);
            try {
                if (!data) {
                    await ref.set({
                        uid: user.uid,
                        name: name,
                        email: user.email || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        plan: 'studyflix-monthly',
                        status: 'pending',
                        applicationStatus: 'pending',
                        membershipNumber: null
                    }, { merge: true });
                } else {
                    const hasName = !!(data.name || data.fullName || data.displayName);
                    if (!hasName) await ref.set({ name: name }, { merge: true });
                }
            } catch (err) { console.warn('Could not heal member doc:', err.message); }
        }

        /* ============================================================
           ANNOUNCEMENTS / NOTIFICATIONS
           ============================================================ */
        const NOTIF_DISMISSED_KEY = 'studyflix_dismissed_notifs';
        let notifCache = null;
        let notifCacheAt = 0;

        function getDismissed() {
            try {
                const raw = localStorage.getItem(NOTIF_DISMISSED_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }
        function setDismissed(list) {
            try {
                const trimmed = list.slice(-50);
                localStorage.setItem(NOTIF_DISMISSED_KEY, JSON.stringify(trimmed));
            } catch (e) {}
        }
        function dismissNotif(id) {
            const d = getDismissed();
            if (!d.includes(id)) {
                d.push(id);
                setDismissed(d);
            }
        }

        const NOTIF_ICONS = {
            info:    'fa-circle-info',
            success: 'fa-check-circle',
            warning: 'fa-triangle-exclamation',
            urgent:  'fa-bell'
        };

        function allowedAudiences(state) {
            if (state === STATE.APPROVED) return ['all', 'active'];
            if (state === STATE.PENDING)  return ['all', 'pending'];
            if (state === STATE.DECLINED) return ['all', 'rejected'];
            return ['all', 'not-applied'];
        }

        async function fetchNotifications(force) {
            const now = Date.now();
            if (!force && notifCache !== null && (now - notifCacheAt) < 60000) {
                return notifCache;
            }
            try {
                const snap = await db.collection('notifications')
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .get();
                notifCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                notifCacheAt = now;
                return notifCache;
            } catch (err) {
                console.warn('Notifications fetch failed:', err.message);
                notifCache = [];
                notifCacheAt = now;
                return [];
            }
        }

        async function renderNotifications(state) {
            const container = els.dashNotifs;
            const all = await fetchNotifications();
            const dismissed = getDismissed();
            const allowed = allowedAudiences(state);

            const visible = all.filter(n => {
                if (n.active === false) return false;
                if (dismissed.includes(n.id)) return false;
                const aud = n.audience || 'all';
                return allowed.includes(aud);
            }).slice(0, 3); // show at most 3 at a time

            if (!visible.length) {
                container.innerHTML = '';
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            container.innerHTML = visible.map(n => {
                const type = ['info','success','warning','urgent'].includes(n.type) ? n.type : 'info';
                const icon = NOTIF_ICONS[type] || NOTIF_ICONS.info;
                const created = toDate(n.createdAt);
                return `
                    <div class="dash-notif ${type}" data-notif-id="${escapeHtml(n.id)}">
                        <div class="dash-notif-icon"><i class="fas ${icon}"></i></div>
                        <div class="dash-notif-body">
                            <div class="dash-notif-title">${escapeHtml(n.title || '')}</div>
                            <div class="dash-notif-text">${escapeHtml(n.text || '').replace(/\n/g, '<br>')}</div>
                            ${created ? `<div class="dash-notif-meta"><i class="fas fa-clock"></i> ${escapeHtml(timeAgo(created))}</div>` : ''}
                        </div>
                        <button type="button" class="dash-notif-close" data-close-id="${escapeHtml(n.id)}" aria-label="Dismiss">
                            <i class="fas fa-xmark"></i>
                        </button>
                    </div>
                `;
            }).join('');

            // Wire dismiss buttons
            container.querySelectorAll('[data-close-id]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.closeId;
                    dismissNotif(id);
                    const card = btn.closest('.dash-notif');
                    if (card) {
                        card.style.transition = 'opacity 0.2s, transform 0.2s';
                        card.style.opacity = '0';
                        card.style.transform = 'translateY(-6px)';
                        setTimeout(() => renderNotifications(state), 220);
                    }
                });
            });
        }

        /* ---------- BANNER ---------- */
        function bannerContent(state) {
            switch (state) {
                case STATE.PENDING:
                    return {
                        cls: 'banner-pending', icon: 'fa-hourglass-half',
                        title: 'Application under review',
                        text: 'Your application has been submitted and is being reviewed. We\'ll notify you once a decision has been made.',
                        cta: { label: 'View Application', href: 'application-status.html' }
                    };
                case STATE.APPROVED:
                    return {
                        cls: 'banner-approved', icon: 'fa-check-circle',
                        title: 'You\'re an active member',
                        text: 'Your membership is active. Show your digital card at any participating StudyFlix partner.',
                        cta: { label: 'View My Card', href: 'membership-card.html' }
                    };
                case STATE.DECLINED:
                    return {
                        cls: 'banner-declined', icon: 'fa-times-circle',
                        title: 'Application declined',
                        text: 'Unfortunately your application was not approved. Please contact support if you believe this was a mistake.',
                        cta: { label: 'Contact Support', href: 'mailto:support@studyflix.example' }
                    };
                default:
                    return {
                        cls: 'banner-none', icon: 'fa-paper-plane',
                        title: 'Welcome to StudyFlix',
                        text: 'Start your membership application to unlock your digital card, partner discounts, and member benefits.',
                        cta: { label: 'Apply Now', href: 'membership-application.html' }
                    };
            }
        }

        function renderBanner(state) {
            const c = bannerContent(state);
            els.statusBanner.className = 'status-banner ' + c.cls;
            els.statusBanner.innerHTML =
                '<div class="banner-icon"><i class="fas ' + c.icon + '"></i></div>' +
                '<div class="banner-body">' +
                    '<div class="banner-title">' + c.title + '</div>' +
                    '<div class="banner-text">' + c.text + '</div>' +
                '</div>' +
                '<div class="banner-action">' +
                    '<a href="' + c.cta.href + '" class="banner-btn">' + c.cta.label + '</a>' +
                '</div>';
        }

        /* ---------- STEPPER ---------- */
        function renderStepper(state) {
            const map = {
                [STATE.NONE]:     ['done', 'current',  'upcoming', 'upcoming'],
                [STATE.PENDING]:  ['done', 'done',     'current',  'upcoming'],
                [STATE.APPROVED]: ['done', 'done',     'done',     'done'],
                [STATE.DECLINED]: ['done', 'done',     'done',     'failed']
            };
            const labels = ['Account Created', 'Application Submitted', 'Under Review', 'Approved'];
            const statuses = map[state] || map[STATE.NONE];

            let html = '';
            for (let i = 0; i < labels.length; i++) {
                const st = statuses[i];
                const circleContent =
                    st === 'done'   ? '<i class="fas fa-check"></i>' :
                    st === 'failed' ? '<i class="fas fa-times"></i>' :
                                      (i + 1);
                html +=
                    '<div class="step-item ' + st + '">' +
                        '<div class="step-circle">' + circleContent + '</div>' +
                        '<div class="step-label">' + labels[i] + '</div>' +
                    '</div>';
                if (i < labels.length - 1) {
                    const lineDone =
                        statuses[i] === 'done' && (statuses[i + 1] === 'done' || statuses[i + 1] === 'current');
                    html += '<div class="step-line ' + (lineDone ? 'done' : '') + '"></div>';
                }
            }
            els.stepper.innerHTML = html;
        }

        /* ---------- BADGES ---------- */
        function badgeClass(raw) {
            const t = (raw || '').toString().toLowerCase();
            if (t === 'active' || t === 'approved')                           return 'badge-active';
            if (t === 'pending' || t === 'in review' || t === 'under review') return 'badge-pending';
            if (t === 'inactive' || t === 'declined' || t === 'rejected')     return 'badge-inactive';
            if (!t)                                                           return 'badge-none';
            return 'badge-pending';
        }
        function badgeLabel(raw, fallback) {
            if (!raw) return fallback || '—';
            return raw.toString().toUpperCase();
        }

        /* ---------- STATS ---------- */
        function renderStats(state, data, user) {
            let memberNo = '—';
            if (state === STATE.APPROVED) {
                memberNo = (data && (data.membershipNumber || data.memberNumber)) ||
                           ('SF' + user.uid.slice(0, 8).toUpperCase());
            }
            setText(els.membershipNumber, memberNo, memberNo === '—');

            const memRaw = data && (data.status || data.membershipStatus);
            let memLabel;
            if (state === STATE.APPROVED)      memLabel = 'ACTIVE';
            else if (state === STATE.DECLINED) memLabel = 'INACTIVE';
            else if (state === STATE.PENDING)  memLabel = 'PENDING';
            else                               memLabel = 'NOT APPLIED';

            const memRaw2 = memRaw || memLabel;
            els.membershipStatus.classList.remove('loading');
            els.membershipStatus.innerHTML =
                '<span class="badge ' +
                badgeClass(state === STATE.APPROVED ? 'active' : state === STATE.DECLINED ? 'inactive' : memRaw2) +
                '">' + badgeLabel(memLabel) + '</span>';

            let appLabel;
            if (state === STATE.APPROVED)      appLabel = 'Approved';
            else if (state === STATE.DECLINED) appLabel = 'Declined';
            else if (state === STATE.PENDING)  appLabel = 'Pending Review';
            else                               appLabel = 'Not Submitted';

            const appForBadge =
                state === STATE.APPROVED ? 'active' :
                state === STATE.DECLINED ? 'inactive' :
                state === STATE.PENDING  ? 'pending' : null;

            els.applicationStatus.classList.remove('loading');
            els.applicationStatus.innerHTML =
                '<span class="badge ' + badgeClass(appForBadge) + '">' + badgeLabel(appLabel) + '</span>';
        }

        function setText(el, value, loading) {
            el.textContent = value;
            el.classList.toggle('loading', !!loading);
        }

        /* ---------- WHAT'S NEXT ---------- */
        function nextActions(state) {
            switch (state) {
                case STATE.PENDING:
                    return [
                        { icon: 'fa-file-alt', title: 'Check application status', desc: 'See where your application stands and what\'s left.', href: 'application-status.html', primary: true },
                        { icon: 'fa-gift',     title: 'Explore member benefits',   desc: 'Browse the discounts and offers you\'ll unlock.',     href: 'benefits.html' }
                    ];
                case STATE.APPROVED:
                    return [
                        { icon: 'fa-id-card', title: 'View your membership card', desc: 'Show it at any participating StudyFlix partner.',  href: 'membership-card.html', primary: true },
                        { icon: 'fa-gift',    title: 'Explore partner benefits',  desc: 'See the discounts and offers available to you.',   href: 'benefits.html' },
                        { icon: 'fa-user',    title: 'Update your profile',       desc: 'Keep your details up to date.',                    href: 'profile.html' }
                    ];
                case STATE.DECLINED:
                    return [
                        { icon: 'fa-headset', title: 'Contact support',           desc: 'Talk to our team about your application.',         href: 'mailto:support@studyflix.example', primary: true },
                        { icon: 'fa-crown',   title: 'Review membership options', desc: 'See what StudyFlix membership includes.',          href: 'membership-plans.html' }
                    ];
                default:
                    return [
                        { icon: 'fa-paper-plane', title: 'Complete your application', desc: 'Submit your details and documents to apply.',  href: 'membership-application.html', primary: true },
                        { icon: 'fa-gift',        title: 'Explore member benefits',   desc: 'See what you get once approved.',              href: 'benefits.html' }
                    ];
            }
        }

        function renderNext(state) {
            const items = nextActions(state);
            els.nextGrid.innerHTML = items.map(it => {
                const cls = 'next-card' + (it.primary ? ' primary' : '');
                return (
                    '<a class="' + cls + '" href="' + it.href + '">' +
                        '<div class="next-icon"><i class="fas ' + it.icon + '"></i></div>' +
                        '<div class="next-title">' + it.title + '</div>' +
                        '<div class="next-desc">' + it.desc + '</div>' +
                        '<div class="next-cta">Open <i class="fas fa-arrow-right"></i></div>' +
                    '</a>'
                );
            }).join('');
        }

        /* ---------- ALL ACTIONS ---------- */
        function renderActions(state) {
            const cards = [
                { icon: 'fa-user',     title: 'My Profile',         desc: 'View and manage your personal information.',          href: 'profile.html' },
                { icon: 'fa-crown',    title: 'Membership Plans',   desc: 'View available StudyFlix membership plans.',           href: 'membership-plans.html' },
                { icon: 'fa-id-card',  title: 'Membership Card',    desc: 'View your digital StudyFlix membership card.',         href: 'membership-card.html', needsApproval: true },
                { icon: 'fa-file-alt', title: 'Application Status', desc: 'Check the status of your membership application.',     href: 'application-status.html' },
                { icon: 'fa-gift',     title: 'Member Benefits',    desc: 'Explore discounts and benefits available to members.', href: 'benefits.html' }
            ];

            els.actionsGrid.innerHTML = cards.map(c => {
                const locked = c.needsApproval && state !== STATE.APPROVED;
                const cls = 'action-card' + (locked ? ' locked' : '');
                const lockTag = locked ? '<span class="lock-tag">After approval</span>' : '';
                const tag = locked ? 'div' : 'a';
                const href = locked ? '' : ' href="' + c.href + '"';
                return (
                    '<' + tag + ' class="' + cls + '"' + href + '>' +
                        lockTag +
                        '<i class="fas ' + c.icon + ' action-icon"></i>' +
                        '<h3>' + c.title + '</h3>' +
                        '<p>' + c.desc + '</p>' +
                    '</' + tag + '>'
                );
            }).join('');
        }

        /* ---------- MAIN RENDER ---------- */
        let currentUser = null;
        let unsubDoc = null;
        let healedOnce = false;

        function renderAll(state, data, user) {
            renderNotifications(state);   // async, doesn't block
            renderBanner(state);
            renderStepper(state);
            renderStats(state, data, user);
            renderNext(state);
            renderActions(state);
        }

        /* ---------- AUTH GUARD ---------- */
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                if (unsubDoc) { unsubDoc(); unsubDoc = null; }
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;
            try { await user.reload(); } catch (e) {}
            const freshUser = auth.currentUser || user;

            els.topEmail.textContent = freshUser.email || '';

            let initialData = null;
            try {
                const snap = await db.collection('members').doc(freshUser.uid).get();
                if (snap.exists) initialData = snap.data();
            } catch (err) { console.warn('Firestore read blocked:', err.message); }

            const resolved = await resolveName(freshUser, initialData);
            els.topName.textContent = resolved.name;
            els.avatarEl.textContent = resolved.name.charAt(0).toUpperCase();
            els.headerName.textContent = resolved.name;
            els.topName.classList.remove('skeleton');

            if (!healedOnce && resolved.source !== 'firestore') {
                healedOnce = true;
                await healMemberDoc(freshUser, resolved.name, initialData);
            }

            if (unsubDoc) unsubDoc();
            unsubDoc = db.collection('members').doc(freshUser.uid).onSnapshot(
                (snap) => {
                    const data = snap.exists ? snap.data() : null;
                    const state = deriveState(data);
                    renderAll(state, data, freshUser);
                },
                (err) => {
                    console.warn('Live updates unavailable:', err.message);
                    const state = deriveState(initialData);
                    renderAll(state, initialData, freshUser);
                }
            );

            // Force a notification refresh on every dashboard visit
            fetchNotifications(true).then(() => {
                const st = deriveState(initialData);
                renderNotifications(st);
            });
        });

        /* ---------- LOGOUT ---------- */
        els.logoutBtn.addEventListener('click', async () => {
            els.logoutBtn.disabled = true;
            try {
                if (unsubDoc) { unsubDoc(); unsubDoc = null; }
                await auth.signOut();
            } catch (err) {
                console.error(err);
                els.logoutBtn.disabled = false;
            }
            window.location.href = 'login.html';
        });
    </script>
