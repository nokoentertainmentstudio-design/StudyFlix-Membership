<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>Applications — StudyFlix Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#FFD700;--orange:#FF6B00;--teal:#00D4B4;--red:#ff5555;--muted:#8892B0;--card:#1C2640;--border:rgba(255,255,255,.07)}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#080C18,#111A2E);color:#E8EEFF;min-height:100vh}
.hero-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 40%,#1e1040 0,transparent 55%),radial-gradient(ellipse at 80% 70%,#0f2040 0,transparent 55%);z-index:-2}
.guard{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,42,.95);z-index:10000;flex-direction:column;gap:1rem}
.guard.hidden{display:none}
.guard-text{color:var(--muted);font-size:.9rem}
.spinner{width:32px;height:32px;border:3px solid rgba(255,215,0,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.main{padding:1.5rem 1.5rem 3rem;max-width:1400px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border);margin-bottom:1.6rem;flex-wrap:wrap}
h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:1.5px}
h1 .hl{background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.85rem;margin-top:.25rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.6rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem}
.stat .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800}
.stat .val{font-size:1.8rem;font-weight:900;line-height:1.1;margin-top:.2rem}
.stat.s-pending .val{color:var(--gold)}
.stat.s-approved .val{color:var(--teal)}
.stat.s-rejected .val{color:#ff9b9b}
.toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.search{position:relative;flex:1;min-width:220px}
.search i{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.search input{width:100%;padding:.7rem 1rem .7rem 2.3rem;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:#E8EEFF;font-size:.85rem;font-family:inherit;outline:none}
.search input:focus{border-color:var(--teal)}
.btn{padding:.6rem 1.1rem;border-radius:10px;font-family:inherit;font-weight:800;font-size:.78rem;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:.4rem;transition:.2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:rgba(255,255,255,.05);color:#E8EEFF;border-color:var(--border)}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.1)}
.btn-teal{background:rgba(0,212,180,.1);color:var(--teal);border-color:rgba(0,212,180,.3)}
.btn-teal:hover:not(:disabled){background:rgba(0,212,180,.2)}
.btn-red{background:rgba(255,85,85,.12);color:#ff9b9b;border-color:rgba(255,85,85,.35)}
.btn-red:hover:not(:disabled){background:rgba(255,85,85,.22)}
.btn-blue{background:rgba(34,136,255,.12);color:#9cc7ff;border-color:rgba(34,136,255,.35)}
.btn-blue:hover:not(:disabled){background:rgba(34,136,255,.22)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--orange));color:#111;border:none}
.btn-sm{padding:.4rem .8rem;font-size:.72rem;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.app-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;transition:.2s;display:flex;flex-direction:column;gap:.8rem}
.app-card:hover{border-color:rgba(255,215,0,.35);transform:translateY(-3px)}
.app-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.app-name{font-weight:800;font-size:1rem;line-height:1.3}
.app-email{color:var(--muted);font-size:.75rem;margin-top:.15rem;word-break:break-all}
.app-meta{display:flex;flex-direction:column;gap:.35rem;font-size:.78rem;color:var(--muted)}
.app-meta span strong{color:#dce2f0;font-weight:700}
.app-actions{display:flex;gap:.4rem;margin-top:auto;padding-top:.4rem}
.app-actions .btn{flex:1;justify-content:center}
.badge{display:inline-block;padding:.22rem .65rem;border-radius:20px;font-size:.62rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.b-pending{background:rgba(255,215,0,.15);color:var(--gold)}
.b-info{background:rgba(34,136,255,.15);color:#9cc7ff}
.empty{text-align:center;padding:4rem 1rem;color:var(--muted);grid-column:1/-1}
.empty i{font-size:3rem;color:rgba(255,215,0,.35);display:block;margin-bottom:1rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center;padding:1.5rem}
.modal.show{display:flex}
.mc{width:100%;max-width:720px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.7rem;box-shadow:0 25px 60px rgba(0,0,0,.6);max-height:92vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem;padding-bottom:.9rem;border-bottom:1px solid var(--border)}
.mh h3{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--gold)}
.mh button{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1}
.mh button:hover{color:var(--teal)}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--border);font-size:.85rem}
.row .lbl{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px}
.row .val{text-align:right;word-break:break-word;max-width:60%}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.8rem}
.doc{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:.8rem;display:flex;align-items:center;gap:.6rem;text-decoration:none;color:inherit;transition:.2s}
.doc:hover{border-color:var(--teal);background:rgba(0,212,180,.05)}
.doc .ic{width:34px;height:34px;border-radius:8px;background:rgba(0,212,180,.12);color:var(--teal);display:flex;align-items:center;justify-content:center}
.doc .in{flex:1;min-width:0}
.doc .in h4{font-size:.78rem;font-weight:800}
.doc .in p{font-size:.68rem;color:var(--muted);margin-top:.1rem}
.doc.missing{opacity:.5;pointer-events:none}
.doc.missing .ic{background:rgba(136,146,176,.1);color:var(--muted)}
.notes{margin-top:1rem}
.notes label{display:block;font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem;letter-spacing:.5px}
.notes textarea{width:100%;padding:.7rem;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:#fff;font-family:inherit;font-size:.85rem;min-height:80px;resize:vertical;outline:none}
.notes textarea:focus{border-color:var(--teal)}
.mactions{display:flex;gap:.5rem;margin-top:1.2rem;flex-wrap:wrap}
.mactions .btn{flex:1;justify-content:center;padding:.7rem}
#toast{position:fixed;bottom:24px;right:24px;background:rgba(28,38,64,.98);border:1px solid var(--border);border-left:3px solid var(--teal);padding:.9rem 1.2rem;border-radius:12px;font-size:.85rem;font-weight:700;z-index:20000;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;max-width:340px}
#toast.error{border-left-color:var(--red);color:#ff9b9b}
@media(max-width:700px){.main{padding-top:75px}h1{font-size:2rem}.stats{grid-template-columns:1fr 1fr}.docs{grid-template-columns:1fr}.row{flex-direction:column;gap:.3rem}.row .val{text-align:left;max-width:100%}}
</style>
</head>
<body class="has-sidebar">
<div class="hero-bg"></div>

<div class="guard" id="guard"><div class="spinner"></div><div class="guard-text" id="guardText">Verifying admin access…</div></div>

<div id="sidebar-placeholder"></div>

<main class="main">
  <div class="topbar">
    <div><h1><span class="hl">Applications</span> Queue</h1><p class="sub">Review, approve, or reject pending membership applications.</p></div>
    <button class="btn btn-ghost" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
  </div>

  <div class="stats">
    <div class="stat s-pending"><div class="lbl">Pending Review</div><div class="val" id="statPending">—</div></div>
    <div class="stat s-approved"><div class="lbl">Approved Today</div><div class="val" id="statApproved">—</div></div>
    <div class="stat s-rejected"><div class="lbl">Rejected Today</div><div class="val" id="statRejected">—</div></div>
  </div>

  <div class="toolbar">
    <div class="search"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name, email, school…" /></div>
  </div>

  <div class="grid" id="grid"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading applications…</p></div></div>
</main>

<div class="modal" id="modal">
  <div class="mc">
    <div class="mh"><h3 id="modalTitle">Application Details</h3><button id="modalClose">&times;</button></div>
    <div id="modalBody"></div>
    <div class="notes"><label for="reviewNotes">Reviewer Notes</label><textarea id="reviewNotes" placeholder="Internal notes (not shown to the applicant)…"></textarea></div>
    <div class="mactions" id="modalActions"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyABNx_RDW8ttLrSRRF0W3kHIzuU2DGpTHI",authDomain:"studyflix-membership.firebaseapp.com",projectId:"studyflix-membership",storageBucket:"studyflix-membership.firebasestorage.app",messagingSenderId:"641080177215",appId:"1:641080177215:web:8dc544f29bbad3d0acbe8a",measurementId:"G-3384WRNWXW"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();

const toastEl=document.getElementById('toast');let tt=null;
function toast(m,err){toastEl.textContent=m;toastEl.classList.toggle('error',!!err);toastEl.style.display='block';clearTimeout(tt);tt=setTimeout(()=>toastEl.style.display='none',3200)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// Sidebar
(async function(){
  try{
    const r=await fetch('admin-sidebar.html');
    document.getElementById('sidebar-placeholder').innerHTML=await r.text();
    const sb=document.getElementById('sidebar'),tg=document.getElementById('sidebarToggle'),cl=document.getElementById('sidebarClose'),ov=document.getElementById('sidebarOverlay'),lo=document.getElementById('sidebarLogout');
    tg.addEventListener('click',()=>{sb.classList.add('open');ov.classList.add('active')});
    function c(){sb.classList.remove('open');ov.classList.remove('active')}
    cl.addEventListener('click',c);ov.addEventListener('click',c);
    const cur=location.pathname.split('/').pop();
    document.querySelectorAll('.sidebar-link').forEach(a=>a.classList.toggle('active',a.dataset.page===cur));
    lo.addEventListener('click',async()=>{lo.disabled=true;try{await auth.signOut()}catch(e){}location.href='admin-login.html'});
  }catch(e){console.error(e)}
})();

let apps=[];let filtered=[];

async function loadApps(){
  const g=document.getElementById('grid');
  g.innerHTML='<div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div>';
  try{
    const snap=await db.collection('members').limit(500).get();
    const all=snap.docs.map(d=>({id:d.id,data:d.data()}));
    apps=all.filter(m=>{
      const d=m.data;
      const hasApp=!!(d.application&&(d.application.submittedAt||d.application.firstName));
      const st=(d.status||'pending').toLowerCase();
      const app=(d.applicationStatus||'pending').toLowerCase();
      return hasApp&&(st==='pending'||app==='pending');
    });
    // stats
    document.getElementById('statPending').textContent=apps.length;
    const today=new Date();today.setHours(0,0,0,0);
    let apToday=0,rejToday=0;
    all.forEach(m=>{
      const d=m.data;
      const rv=d.reviewedAt&&d.reviewedAt.toDate?d.reviewedAt.toDate():null;
      if(!rv||rv<today)return;
      const s=(d.status||'').toLowerCase();
      if(s==='active'||s==='approved')apToday++;
      if(s==='rejected')rejToday++;
    });
    document.getElementById('statApproved').textContent=apToday;
    document.getElementById('statRejected').textContent=rejToday;
    applyFilter();
    const b=document.getElementById('pendingCount');
    if(b&&apps.length>0){b.textContent=apps.length;b.style.display='inline-block'}
  }catch(err){
    console.error(err);
    g.innerHTML='<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>'+esc(err.message)+'</p></div>';
    toast('Load failed: '+(err.code||err.message),true);
  }
}

function applyFilter(){
  const q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  filtered=apps.filter(m=>{
    if(!q)return true;
    const d=m.data;
    const hay=[d.name,d.fullName,d.email,d.school,d.location].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  render();
}

function render(){
  const g=document.getElementById('grid');
  if(!filtered.length){g.innerHTML='<div class="empty"><i class="fas fa-check-circle"></i><p style="font-weight:800;margin-bottom:.4rem">All caught up!</p><p>No pending applications match your search.</p></div>';return}
  g.innerHTML=filtered.map(m=>{
    const d=m.data;const app=d.application||{};
    const name=esc((app.firstName||'')+' '+(app.lastName||'')).trim()||esc(d.name||d.fullName||'(no name)');
    const email=esc(app.email||d.email||'');
    const school=esc(app.school||d.school||'—');
    const loc=esc(app.location||d.location||'—');
    const submitted=app.submittedAt&&app.submittedAt.toDate?app.submittedAt.toDate().toLocaleString():'—';
    return `<div class="app-card">
      <div class="app-head">
        <div>
          <div class="app-name">${name}</div>
          <div class="app-email">${email}</div>
        </div>
        <span class="badge b-pending">Pending</span>
      </div>
      <div class="app-meta">
        <span><strong>School:</strong> ${school}</span>
        <span><strong>Location:</strong> ${loc}</span>
        <span><strong>Submitted:</strong> ${submitted}</span>
      </div>
      <div class="app-actions">
        <button class="btn btn-teal btn-sm" data-view="${m.id}"><i class="fas fa-eye"></i> Review</button>
        <button class="btn btn-teal btn-sm" data-approve="${m.id}"><i class="fas fa-check"></i></button>
        <button class="btn btn-red btn-sm" data-reject="${m.id}"><i class="fas fa-times"></i></button>
      </div>
    </div>`;
  }).join('');
  g.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.view)));
  g.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>quickAction(b.dataset.approve,'active')));
  g.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click',()=>quickAction(b.dataset.reject,'rejected')));
}

async function quickAction(id,to){
  if(!confirm('Set this application to '+to+'?'))return;
  try{
    const upd={status:to==='active'?'active':'rejected',applicationStatus:to==='active'?'approved':'rejected',reviewedAt:firebase.firestore.FieldValue.serverTimestamp(),reviewedBy:auth.currentUser.uid};
    await db.collection('members').doc(id).update(upd);
    await logActivity('application_'+to,{memberId:id});
    toast('Application '+to+'.');
    await loadApps();
  }catch(err){console.error(err);toast('Failed: '+(err.code||err.message),true)}
}

async function logActivity(type,payload){try{await db.collection('activity').add({type,by:auth.currentUser.uid,byEmail:auth.currentUser.email,at:firebase.firestore.FieldValue.serverTimestamp(),...payload})}catch(e){}}

const modal=document.getElementById('modal');
document.getElementById('modalClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function closeModal(){modal.classList.remove('show')}

function openModal(id){
  const m=apps.find(x=>x.id===id);if(!m)return;
  const d=m.data;const app=d.application||{};
  document.getElementById('modalTitle').textContent=((app.firstName||'')+' '+(app.lastName||'')).trim()||d.name||'Application';
  const rows=[
    ['Email',app.email||d.email],
    ['Phone',app.phone||d.phone],
    ['School',app.school||d.school],
    ['Location',app.location||d.location],
    ['School Code',app.schoolCode||d.schoolCode],
    ['Submitted',app.submittedAt&&app.submittedAt.toDate?app.submittedAt.toDate().toLocaleString():'—'],
    ['Payment',app.payment&&app.payment.transactionId?'Paid ('+app.payment.transactionId+')':'Not paid'],
    ['Member ID',m.id]
  ];
  document.getElementById('modalBody').innerHTML=rows.map(([l,v])=>`<div class="row"><div class="lbl">${esc(l)}</div><div class="val">${esc(v||'—')}</div></div>`).join('')+
    `<div class="docs">
      <a class="doc${app.documents&&app.documents.identityUrl?'':' missing'}" href="${app.documents&&app.documents.identityUrl?esc(app.documents.identityUrl):'#'}" target="_blank" rel="noopener"><div class="ic"><i class="fas fa-id-card"></i></div><div class="in"><h4>Identity Document</h4><p>${app.documents&&app.documents.identityUrl?'Click to view':'Not uploaded'}</p></div></a>
      <a class="doc${app.documents&&app.documents.schoolProofUrl?'':' missing'}" href="${app.documents&&app.documents.schoolProofUrl?esc(app.documents.schoolProofUrl):'#'}" target="_blank" rel="noopener"><div class="ic"><i class="fas fa-file-alt"></i></div><div class="in"><h4>Proof of School</h4><p>${app.documents&&app.documents.schoolProofUrl?'Click to view':'Not uploaded'}</p></div></a>
    </div>`;
  document.getElementById('reviewNotes').value='';
  const ma=document.getElementById('modalActions');
  ma.innerHTML=`
    <button class="btn btn-blue" data-act="info"><i class="fas fa-circle-info"></i> Request Info</button>
    <button class="btn btn-red" data-act="rejected"><i class="fas fa-times"></i> Reject</button>
    <button class="btn btn-teal" data-act="active"><i class="fas fa-check"></i> Approve</button>
  `;
  ma.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',async()=>{
    const a=b.dataset.act;
    const notes=document.getElementById('reviewNotes').value.trim();
    if(a==='info'){
      if(!notes){toast('Please write what info you need in the notes.',true);return}
      try{
        await db.collection('members').doc(m.id).update({reviewNotes:notes,reviewStatus:'info_requested',reviewedAt:firebase.firestore.FieldValue.serverTimestamp(),reviewedBy:auth.currentUser.uid});
        await logActivity('application_info_requested',{memberId:m.id,notes});
        toast('Marked as needing more info.');closeModal();await loadApps();
      }catch(err){toast('Failed: '+(err.code||err.message),true)}
      return;
    }
    if(!confirm('Set this application to '+a+'?'))return;
    b.disabled=true;
    try{
      const upd={status:a==='active'?'active':'rejected',applicationStatus:a==='active'?'approved':'rejected',reviewedAt:firebase.firestore.FieldValue.serverTimestamp(),reviewedBy:auth.currentUser.uid};
      if(notes)upd.reviewNotes=notes;
      await db.collection('members').doc(m.id).update(upd);
      await logActivity('application_'+a,{memberId:m.id,notes});
      toast('Application '+a+'.');closeModal();await loadApps();
    }catch(err){toast('Failed: '+(err.code||err.message),true);b.disabled=false}
  }));
  modal.classList.add('show');
}

document.getElementById('searchInput').addEventListener('input',()=>{clearTimeout(window._st);window._st=setTimeout(applyFilter,200)});
document.getElementById('refreshBtn').addEventListener('click',async e=>{e.target.disabled=true;await loadApps();e.target.disabled=false;toast('Refreshed.')});

auth.onAuthStateChanged(async user=>{
  const guard=document.getElementById('guard'),gt=document.getElementById('guardText');
  if(!user){gt.textContent='Not signed in. Redirecting…';setTimeout(()=>location.href='admin-login.html',1000);return}
  try{
    const snap=await db.collection('admins').doc(user.uid).get();
    if(!snap.exists||snap.data().role!=='admin'||snap.data().status!=='active'){gt.textContent='Not an admin.';setTimeout(()=>location.href='admin-login.html',1200);return}
    const d=snap.data();const name=d.name||user.email.split('@')[0];
    const av=document.getElementById('sidebarAdminAvatar'),nm=document.getElementById('sidebarAdminName'),em=document.getElementById('sidebarAdminEmail');
    if(av)av.textContent=name.charAt(0).toUpperCase();if(nm)nm.textContent=name;if(em)em.textContent=user.email||'';
    guard.classList.add('hidden');
    await loadApps();
  }catch(err){console.error(err);gt.textContent='Verification failed.';setTimeout(()=>location.href='admin-login.html',1500)}
});
</script>
</body>
</html>
